project:
  seed: 2026
  input_csv: ../Cement_ESP_Data.csv
  output_dir: outputs

data:
  censor_threshold_mgNm3: 50.0
  target_limits_mgNm3: [10.0, 5.0]
  rolling_window_minutes: 15

regimes:
  k_min: 3
  k_max: 10
  selection_metric: silhouette
  switch_penalty: 8.0
  minimum_share: 0.01
  minimum_median_dwell_minutes: 15

representative_regimes:
  # Five percent of one week is 504 minutes, enough to exclude the 120-minute
  # high-temperature anomaly while retaining both stable load extremes.
  minimum_share: 0.05
  # Rounded midpoint between the data q98=135.24 C and q99=152.90 C.
  maximum_temperature_p95_C: 145.0

emission_prior:
  # With unobserved field geometry/migration coefficients treated equally,
  # the D-A voltage proxy gives w_i = U_ref_i^2 / sum_j U_ref_j^2.
  stage_weight_method: reference_voltage_squared
  stage_weight_concentration: 120.0
  # Use the attachment mean as a reproducible operating reference; it is not
  # interpreted as a universally optimal ESP temperature.
  temperature_reference_method: data_mean
  temperature_sensitivity: 0.12
  temperature_scale_C: 25.0
  plate_penalty: 0.18
  # First-order dust mass balance: deposition rate x time between raps.
  # Delta=0.07 preserves the former reference-point uplift 1+0.055+0.015.
  rapping_load_coefficient: 0.07
  # These are scenario widths, not a claimed full Bayesian posterior.
  # The wider +/-30% epistemic stress test is run separately.
  log_residual_sigma: 0.01
  removal_scale_relative_sd: 0.02
  prior_relative_sd: 0.10

optimization:
  confidence: 0.95
  scenario_quantile_buffer: 0.025
  # 768 leaves about 19 samples in the 2.5% design tail; 10,000 reduces the
  # Monte Carlo standard error near 95% compliance to about 0.22 percentage point.
  training_scenarios: 768
  verification_scenarios: 10000
  # For 8 variables this gives a 72-member DE population and at most about
  # 6,500 global-search evaluations before local SLSQP refinement.
  differential_evolution_maxiter: 90
  differential_evolution_popsize: 9
  dust_load_limit: 1.45
  penalty_scale: 1000000.0
  # A narrower feasible solution is used only as an optimizer warm start.
  q4_voltage_screen_factor: 1.02
  # Question 4 uses a deliberately wide engineering scenario rather than
  # selecting the smallest feasible uplift: each historical voltage upper
  # bound is multiplied by 1.10, while all rapping bounds remain unchanged.
  q4_voltage_upper_extension_factor: 1.10
